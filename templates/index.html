<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transcription d'ecriture manuscrite</title>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --accent: #2f6feb;
    --accent-dark: #2557bf;
    --text: #1f2430;
    --muted: #6b7280;
    --border: #e2e4e9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.subtitle { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
  .layout { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .left { width: 380px; flex-shrink: 0; display: flex; flex-direction: column; gap: 14px; }
  .right { flex: 1; min-width: 320px; }
  h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 0 0 8px;
  }
  input[type="file"] { font-size: 13px; }
  #preview { max-width: 100%; border-radius: 8px; display: none; margin-top: 12px; }
  button {
    border: none;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
  }
  .btn-primary { background: var(--accent); color: white; width: 100%; }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-secondary { background: #eef0f3; color: var(--text); }
  .btn-secondary:hover { background: #e2e4e9; }
  .status { font-size: 13px; color: var(--muted); min-height: 18px; }
  textarea {
    width: 100%;
    min-height: 320px;
    resize: vertical;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    font-size: 14px;
    font-family: inherit;
    line-height: 1.5;
  }
  .result-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .empty-state {
    color: var(--muted);
    font-size: 14px;
    padding: 60px 20px;
    text-align: center;
    border: 1px dashed var(--border);
    border-radius: 10px;
  }
  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<h1>Transcription d'ecriture manuscrite</h1>
<p class="subtitle">Charge une photo contenant du texte ecrit a la main : l'outil le retranscrit en texte que tu peux copier-coller.</p>

<div class="layout">
  <div class="panel left">
    <h2>Photo</h2>
    <input type="file" id="fileInput" accept="image/*">
    <img id="preview" alt="Apercu de la photo">
    <button class="btn-primary" id="extractBtn" disabled style="margin-top:8px;">Transcrire le texte</button>
    <div class="status" id="status"></div>
  </div>

  <div class="panel right">
    <div class="result-header">
      <h2 style="margin:0;">Texte transcrit</h2>
      <button class="btn-secondary" id="copyBtn" style="display:none;">Copier</button>
    </div>
    <div id="emptyState" class="empty-state">Le texte transcrit apparaitra ici.</div>
    <textarea id="resultText" style="display:none;" placeholder="Le texte transcrit apparaitra ici..."></textarea>
  </div>
</div>

<script>
const fileInput = document.getElementById('fileInput');
const preview = document.getElementById('preview');
const extractBtn = document.getElementById('extractBtn');
const statusEl = document.getElementById('status');
const emptyState = document.getElementById('emptyState');
const resultText = document.getElementById('resultText');
const copyBtn = document.getElementById('copyBtn');

let currentFile = null;

function setStatus(msg, isLoading) {
  statusEl.innerHTML = isLoading ? `<span class="spinner"></span>${msg}` : (msg || '');
}

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (!file) return;
  currentFile = file;
  preview.src = URL.createObjectURL(file);
  preview.style.display = 'block';
  extractBtn.disabled = false;
  setStatus('');
  resultText.style.display = 'none';
  copyBtn.style.display = 'none';
  emptyState.style.display = 'block';
  emptyState.textContent = 'Le texte transcrit apparaitra ici.';
});

extractBtn.addEventListener('click', async () => {
  if (!currentFile) return;
  extractBtn.disabled = true;
  setStatus('Transcription en cours...', true);
  try {
    const formData = new FormData();
    formData.append('image', currentFile);
    const res = await fetch('/api/extract', { method: 'POST', body: formData });
    const data = await res.json();

    if (!res.ok || data.error) {
      setStatus('Erreur : ' + (data.error || res.statusText));
      return;
    }

    if (!data.text) {
      emptyState.style.display = 'block';
      emptyState.textContent = data.warning || 'Aucun texte detecte.';
      resultText.style.display = 'none';
      copyBtn.style.display = 'none';
      setStatus('');
      return;
    }

    resultText.value = data.text;
    resultText.style.display = 'block';
    emptyState.style.display = 'none';
    copyBtn.style.display = 'inline-block';
    setStatus(data.warning || 'Transcription terminee. Verifie et corrige si besoin.');
  } catch (err) {
    setStatus('Erreur reseau lors de la transcription.');
  } finally {
    extractBtn.disabled = false;
  }
});

copyBtn.addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(resultText.value);
    copyBtn.textContent = 'Copie !';
    setTimeout(() => { copyBtn.textContent = 'Copier'; }, 1500);
  } catch (err) {
    resultText.select();
    document.execCommand('copy');
  }
});
</script>
</body>
</html>
